[package]
name = "skylauncher"
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["T4skor"]
description = "Launcher independiente de Minecraft Java con perfiles locales, loaders y skins"

[dependencies]
eframe = "0.31"
serde_json = "1"
webbrowser = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"

[profile.release]
strip = true
lto = "thin"
